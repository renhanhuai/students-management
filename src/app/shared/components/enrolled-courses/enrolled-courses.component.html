<section aria-label="Enrolled courses" class="student-course-details">
  <h2>Enrolled courses</h2>
  @if (courses.length === 0) {
    <p>This student is not enrolled in any courses.</p>
  } @else {
    @for (course of courses; track course.id) {
      <p>{{ course.name }} ({{ course.code }})</p>
    }
  }
</section>
