<section class="notification-list" aria-label="Notifications" aria-live="polite">
  @for (notification of notificationService.notifications$ | async; track notification.id) {
    <div class="notification"
      [class.success]="notification.type === 'success'"
      [class.warning]="notification.type === 'warning'"
      [class.error]="notification.type === 'error'"
      [attr.role]="notification.type === 'success' ? 'status' : 'alert'">
      <span>{{ notification.message }}</span>
      <button
        type="button"
        [attr.aria-label]="'Dismiss ' + notification.type + ' message'"
        (click)="notificationService.dismiss(notification.id)">
        Dismiss
      </button>
    </div>
  }
</section>
